<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfumatura per lo sfondo dark -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Sfumatura Cyan per il testo e il bordo -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Sfondo arrotondato -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />

  <!-- Bordo sottile in Cyan -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#cyanGradient)" stroke-width="8" opacity="0.4" />

  <!-- Testo YAL -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    fill="url(#cyanGradient)" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="180" 
    font-weight="900" 
    letter-spacing="6"
  >
    YAL
  </text>
</svg>
